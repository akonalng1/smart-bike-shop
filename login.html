<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign in - Smart Bike Shop</title><meta name="description" content="Smart Bike Shop: bicycle parts and accessories delivered across the Philippines.">
<link rel="icon" href="data:,"><link rel="stylesheet" href="css/style.css"></head>
<body data-page="login"><div id="nav"></div>
<main class="auth"><div class="auth-side"><h1>Welcome back.</h1><p>Sign in to check out, track your orders and keep your cart across devices.</p></div>
<div class="auth-form"><form id="login" novalidate><h2>Sign in</h2><div id="msg" role="alert"></div>
<div class="field"><label for="email">Gmail address</label><input id="email" name="email" type="email" autocomplete="email" required placeholder="name@gmail.com"></div>
<div class="field"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required></div>
<div class="field row2"><div class="check"><input id="remember" name="remember" type="checkbox" checked><label for="remember">Remember me</label></div><button class="linklike" type="button" id="forgot" style="justify-self:end">Forgot password?</button></div>
<button class="btn btn-primary" style="width:100%" id="go">Sign in</button><p class="muted">New here? <a href="register.html">Create an account</a></p></form></div></main>

<div id="foot"></div>
<script type="module" src="js/auth.js"></script>
</body></html>
